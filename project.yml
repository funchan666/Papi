name: Papi
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) PAPI_DUO_SDK'
targets:
  Papi:
    type: application
    platform: iOS
    sources:
      - path: Papi
        excludes: [Resources]
      - path: Papi/Resources/Assets.xcassets
        buildPhase: resources
      - path: Papi/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Papi/Resources/Media
        type: folder
        buildPhase: resources
      - path: Papi/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Papi/Resources/Localization
        type: folder
        buildPhase: resources
      - path: Papi/Resources/InfoPlistLocalizations
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papi.coffee
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      gatherCoverageData: false
      management:
        shared: true
